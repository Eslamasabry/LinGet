<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>linget · galaxy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l3.2 9.8L29 16l-9.8 3.2L16 29l-3.2-9.8L3 16l9.8-3.2z' fill='%235ec8dc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="nebula"></div>

  <header id="hud">
    <div class="hud-row hud-top">
      <div class="brand"><span class="mark">◆</span> linget</div>
      <div class="stats" id="stats"></div>
      <button id="refresh" class="ghost" title="refresh catalog">↻</button>
    </div>
    <div class="hud-row hud-controls">
      <input id="search" type="search" placeholder="search · src:npm" autocomplete="off" spellcheck="false">
      <button id="list-btn" class="ghost" title="browse as list">☰</button>
      <button id="queue-btn" class="ghost">queue <span id="queue-badge" class="badge hidden"></span></button>
    </div>
    <div class="hud-row chips" id="chips"></div>
  </header>

  <aside id="results" class="panel hidden">
    <div class="results-head">
      <span id="results-count"></span>
      <button class="close" data-close="results">✕</button>
    </div>
    <div id="results-list"></div>
  </aside>

  <aside id="detail" class="panel hidden">
    <button class="close" data-close="detail">✕</button>
    <div class="detail-name" id="d-name"></div>
    <div class="detail-meta" id="d-meta"></div>
    <div class="detail-desc" id="d-desc"></div>
    <div class="detail-versions" id="d-versions"></div>
    <div class="detail-facts" id="d-facts"></div>
    <div class="detail-actions" id="d-actions"></div>
    <div class="changelog hidden" id="d-changelog"></div>
  </aside>

  <aside id="queue-drawer" class="panel hidden">
    <button class="close" data-close="queue-drawer">✕</button>
    <div class="drawer-title">queue</div>
    <div id="queue-list"></div>
    <div class="log-tail hidden" id="queue-log-wrap">
      <div class="log-tail-title">live output</div>
      <div id="queue-log"></div>
    </div>
    <div class="drawer-actions">
      <button id="retry" class="ghost">retry failed</button>
    </div>
  </aside>

  <div id="toast" class="hidden"></div>
  <div id="boot">
    <div class="boot-spin"></div>
    <div class="boot-text" id="boot-text">assembling the catalog</div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
